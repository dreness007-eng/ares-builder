name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MinGW
      run: |
        choco install mingw -y
        refreshenv

    - name: Build C executable
      run: |
        gcc --version
        gcc -o ares.exe main.c -lwininet -lshell32 -ladvapi32 -mwindows -O2 -s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ares-${{ github.run_id }}
        path: ares.exe

